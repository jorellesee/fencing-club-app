name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'   # the same as the Dockerfile, so CI tests what runs live
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py test
      - run: docker build -t fencing .   # catches a broken Dockerfile or collectstatic
