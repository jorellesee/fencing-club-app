{% extends 'web/layout.html' %}
{% block main %}
<div class="calendar-page" x-data="peek()">
  <div class="calendar" x-data="filters({{ filters_json }})">
    {% include 'web/sessions/header.html' %}
    <div class="calendar-body"
         x-data="sessionCalendar({
           events: '{% url 'calendar_events' %}',
           editable: {% if request.role == 'manager' %}true{% else %}false{% endif %},
           moveUrl: '{% url 'session_move' 0 %}',
           newUrl: '{% url 'session_new' %}',
         })"></div>
  </div>
  <div id="panel"></div>
</div>
{% endblock %}
