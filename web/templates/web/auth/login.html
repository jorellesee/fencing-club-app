{% extends 'web/auth/card.html' %}
{% block card %}
<h1>Fencing Club</h1>
<form method="post" class="login-form">
  {% csrf_token %}
  {% include 'web/partials/field.html' with field=form.username %}
  {% include 'web/partials/field.html' with field=form.password %}
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <button class="button primary">Log in</button>
</form>
<a class="link-button" href="{% url 'forgot_password' %}">Forgot password?</a>
{% endblock %}
